# ---------------------------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------------------------

[project]
name = "pytktable-binaries"
# The version of Tktable it contains, plus a fourth number for fixes of this package with the
# same Tktable (e.g. 2.12.2.1). See "Versioning" in README.md.
version = "2.12.2"
description = "Prebuilt Tktable, the Tcl/Tk table widget, for pytktable."
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE.md", "tktable-src/license.txt"]
authors = [
    { name = "nbro", email = "nbrosoftware@outlook.com" },
]
keywords = ["tkinter", "tk", "tcl", "table", "tktable", "widget", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Tcl Extensions",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nbro/pytktable-binaries"
"Tktable source" = "https://github.com/bohagan1/TkTable"
pytktable = "https://github.com/nbro/tktable"

# ---------------------------------------------------------------------------------------------
# Poetry
# ---------------------------------------------------------------------------------------------

[tool.poetry]
packages = [{ include = "tktable_binaries" }]
# The compiled Tktable folder is not in Git (see .gitignore), so include it explicitly.
include = [{ path = "tktable_binaries/Tktable*/*", format = "wheel" }]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.7.0"

# ---------------------------------------------------------------------------------------------
# Tools: formatting
# ---------------------------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

# ---------------------------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------------------------

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
